# adapter_rules.conf - settings applied by rulestoset.ksh
#
#   <adapter id>  <attribute=value>    FC adapter model, id as shown in () by "lscfg -vl fcsN"
#   default       <attribute=value>    any fcs adapter without an explicit entry (comment out to disable)
#   <rule type>   <attribute=value>    any other rule, applied on every server
#
# NOTE: the original script had max_transfer_size / num_control_elems for df1000e21410f103. Those are not
#       fcs attributes (the real names are max_xfer_size / num_cmd_elems, as used for the other card) and
#       the original was marked "examples not accurate". Check against "lsattr -El fcsN" before trusting.

# --- FC adapters ---
df1000e21410f103   max_xfer_size=0x400000
df1000e21410f103   num_io_queues=16
df1000e21410f103   num_cmd_elems=2048

7710812214105106   max_xfer_size=0x1000000
7710812214105106   num_io_queues=16
7710812214105106   num_cmd_elems=2048

df1000f114108a03   num_io_queues=16
df1000f114100104   num_io_queues=16
df1000e31410a006   num_io_queues=16

# Applied to any fcs adapter without an explicit entry above. These are the values the 4.1.2.10
# fresh-install script set on every FC adapter with chdev -P.
default            num_io_queues=16
default            num_cmd_elems=2048
default            max_xfer_size=0x1000000
default            max_npivs=128

# --- every VIO server ---
adapter/vdevice/IBM,l-lan   max_buf_huge=128
adapter/vdevice/IBM,l-lan   max_buf_large=256
adapter/vdevice/IBM,l-lan   max_buf_medium=2048
adapter/vdevice/IBM,l-lan   queues_rx=4
disk/fcp/mpioosdisk         reserve_policy=no_reserve
